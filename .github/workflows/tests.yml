name: Lamii Tests

on:
  push:
    branches: ['main', 'production', 'feature/**']
  pull_request:
    branches: ['main', 'production']

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, sqlite3, pdo_sqlite
          coverage: none
          tools: composer:2

      - name: Install dependencies
        run: composer update laravel/reverb --with-dependencies --no-interaction --prefer-dist

      - name: Persist refreshed Composer lock
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- composer.lock; then
            echo 'Composer lock is already current.'
            exit 0
          fi
          content=$(base64 -w0 composer.lock)
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/composer.lock?ref=${GITHUB_REF_NAME}" --jq .sha)
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/composer.lock" \
            -f message='ci: refresh Composer lock for Reverb dependency' \
            -f branch="${GITHUB_REF_NAME}" \
            -f sha="${sha}" \
            -f content="${content}"

      - name: Validate Composer
        run: composer validate

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          mkdir -p storage/framework/cache storage/framework/data storage/framework/sessions storage/framework/testing storage/framework/views bootstrap/cache
          chmod -R ug+rw storage bootstrap/cache
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
          sed -i 's#^DB_DATABASE=.*#DB_DATABASE=database/database.sqlite#' .env

      - name: Run migrations
        run: php artisan migrate:fresh --env=testing

      - name: Check routes
        run: php artisan route:list

      - name: Run tests
        run: ./vendor/bin/phpunit
