name: Refresh Reverb Composer Lock

on:
  push:
    branches:
      - feature/lamii-realtime-reverb

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, sqlite3, pdo_sqlite
          coverage: none
          tools: composer:2

      - name: Update Reverb dependency lock
        run: composer update laravel/reverb --with-dependencies --no-interaction --prefer-dist

      - name: Commit updated lock file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add composer.lock
          if git diff --cached --quiet; then
            echo 'Composer lock is already up to date.'
            exit 0
          fi
          git commit -m 'ci: refresh Composer lock for Reverb dependency'
          git push
